<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herramienta Diagnóstica MÁXIMA — DentaNota</title>
<style>
:root{--v:#12b5a0;--vo:#0a8f7e;--tx:#173832;--ts:#5b7d76;--bd:#c3e6de;--line:#8fb8b0;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Segoe UI",Arial,sans-serif;color:var(--tx);background:#f5f7f6;min-height:100vh;}

.top-bar{background:var(--v);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px;}
.top-bar h1{font-size:14px;display:flex;align-items:center;gap:8px;margin:0;}
.top-bar h1::before{content:"◆";font-size:18px;}

.api-section{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);padding:8px 12px;border-radius:6px;}
.api-section label{font-size:11px;margin:0;}
.api-section input{padding:6px 10px;border:none;border-radius:4px;font-size:10px;width:250px;}

.container{display:grid;grid-template-columns:1fr 1fr;gap:20px;min-height:calc(100vh - 60px);padding:20px;}

.form-panel{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow-y:auto;}
.form-panel h2{color:var(--vo);font-size:12pt;margin:12px 0 10px;display:flex;align-items:center;gap:6px;}
.form-panel h2:first-child{margin-top:0;}

.form-group{margin-bottom:12px;display:flex;flex-direction:column;}
.form-group label{font-size:8pt;font-weight:700;color:var(--ts);text-transform:uppercase;letter-spacing:.3px;margin-bottom:5px;}
.form-group input,.form-group textarea{font-size:9pt;padding:8px 10px;border:1px solid var(--bd);border-radius:6px;font-family:inherit;color:var(--tx);}
.form-group textarea{resize:vertical;min-height:100px;}
.form-group input:focus,.form-group textarea:focus{outline:none;border-color:var(--v);background:#f9fffe;}

.photo-upload{border:2px dashed var(--v);border-radius:8px;padding:16px;text-align:center;cursor:pointer;}
.photo-upload:hover{background:#f0faf8;}
.photo-upload input[type="file"]{display:none;}

.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px;}
.photo-card{border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:#fff;}
.photo-card img{width:100%;height:120px;object-fit:cover;}
.photo-card-footer{padding:8px;background:#f9fffe;display:flex;justify-content:space-between;align-items:center;}
.photo-card-label{font-size:8pt;color:var(--ts);font-weight:700;flex:1;}
.photo-remove{background:#ff6b6b;color:#fff;border:none;border-radius:4px;padding:4px 8px;font-size:8px;cursor:pointer;}

.sec-divider{border-top:2px solid var(--bd);margin:10px 0;padding-top:10px;}

.btn-group{display:flex;gap:8px;margin-top:12px;}
.btn-gen{background:linear-gradient(180deg,#22cfb8,#0fa892);color:#fff;border:none;border-radius:8px;padding:10px 14px;font-size:10px;font-weight:700;cursor:pointer;flex:1;box-shadow:0 4px 12px rgba(18,181,160,.3);}
.btn-gen:hover{opacity:.95;}
.btn-ia{background:#667eea;}
.btn-integrar{background:#ff9f1c;}

.status{font-size:8pt;color:var(--ts);text-align:center;margin-top:8px;min-height:16px;}
.status.loading{color:#667eea;font-weight:700;animation:pulse 1.5s infinite;}
.status.success{color:#12b5a0;font-weight:700;}
.status.error{color:#ff6b6b;font-weight:700;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.7;}}

.hallazgos-box{background:#f0faf8;border:1px solid var(--bd);border-radius:8px;padding:10px;margin-top:10px;font-size:8.6pt;line-height:1.6;color:var(--ts);}
.hallazgos-box strong{color:var(--v);display:block;margin-bottom:8px;}

.preview-panel{position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;}
.print-btn{background:linear-gradient(180deg,#22cfb8,#0fa892);color:#fff;border:none;border-radius:8px;padding:10px 14px;font-size:11px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(18,181,160,.4);margin-bottom:12px;width:100%;}

.sheet{background:#fff;padding:20px 26px;border-radius:8px;flex:1;overflow-y:auto;font-size:9.3pt;line-height:1.55;color:var(--tx);}

.hdr{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2.5px solid var(--v);padding-bottom:9px;margin-bottom:12px;}
.hdr-l{display:flex;gap:10px;align-items:center;}
.logo{width:40px;height:40px;background:var(--v);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:21px;color:#fff;}
.hdr h1{font-size:14pt;color:var(--vo);margin:0;}
.hdr .sub{font-size:7.8pt;color:var(--ts);}
.hdr-r{text-align:right;font-size:7.6pt;color:var(--ts);}

.doc-title{text-align:center;font-size:12pt;font-weight:700;color:var(--vo);margin:8px 0 3px;}
.doc-sub{text-align:center;font-size:8pt;color:var(--ts);margin-bottom:12px;}

.sec-t{background:var(--vo);color:#fff;font-size:8.8pt;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:4px 11px;border-radius:20px;display:inline-block;margin:10px 0 8px;}
.sec-t:first-of-type{margin-top:0;}

.data-row{display:grid;grid-template-columns:120px 1fr;gap:10px;margin-bottom:6px;font-size:8.6pt;}
.data-row label{font-weight:700;color:var(--vo);}
.data-row .filled{border-bottom:1px solid var(--line);padding:1px 0;min-height:12px;}

.analysis-sec{margin-top:12px;font-size:8.6pt;line-height:1.6;}
.analysis-sec strong{color:var(--v);font-size:9pt;display:block;margin-bottom:4px;}

.photo-in-doc{margin:10px 0;border:1px solid var(--bd);border-radius:8px;overflow:hidden;}
.photo-in-doc img{width:100%;height:auto;display:block;}
.photo-caption{font-size:7.8pt;color:var(--ts);padding:6px 8px;background:#f9fffe;border-top:1px solid var(--bd);}

.foot{margin-top:12px;border-top:1px dashed var(--bd);padding-top:6px;font-size:7pt;color:var(--ts);text-align:center;}

@media (max-width:1400px){
  .container{grid-template-columns:1fr;height:auto;}
  .preview-panel{height:auto;position:static;}
  .form-panel{max-height:none;}
}

@media print{
  .top-bar,.form-panel,.print-btn{display:none;}
  .container{display:block;padding:0;gap:0;height:auto;}
  .preview-panel{position:static;height:auto;}
  .sheet{border-radius:0;padding:0;}
  @page{size:letter;margin:0.9cm;}
}
</style>
</head>
<body>

<div class="top-bar">
  <h1>HERRAMIENTA DIAGNÓSTICA MÁXIMA</h1>
  <div class="api-section">
    <label>⚙️ MODO PROXY SEGURO</label>
    <div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;">
      <div style="flex:1;min-width:250px;">
        <label style="display:block;font-size:9px;color:#666;margin-bottom:3px;">URL Cloud Function</label>
        <input type="text" id="proxyUrl" placeholder="us-central1-tu-proyecto.cloudfunctions.net/analyzeRadiograph" style="width:100%;padding:6px 8px;border:1px solid #ccc;border-radius:4px;font-size:10px;font-family:monospace;">
      </div>
      <div style="flex:0.8;min-width:220px;">
        <label style="display:block;font-size:9px;color:#666;margin-bottom:3px;">API Key</label>
        <div style="display:flex;gap:4px;">
          <input type="password" id="apiKey" placeholder="Tu clave Gemini" style="flex:1;padding:6px 8px;border:1px solid #ccc;border-radius:4px;font-size:10px;">
          <button type="button" onclick="toggleApiKey()" style="background:#667eea;color:#fff;border:none;padding:6px 8px;border-radius:4px;font-size:9px;cursor:pointer;white-space:nowrap;">👁</button>
        </div>
      </div>
      <button type="button" onclick="cargarConfiguracionDentaNota()" style="background:#4caf50;color:#fff;border:none;padding:8px 12px;border-radius:4px;font-size:10px;cursor:pointer;white-space:nowrap;align-self:flex-end;">📥 Cargar de DentaNota</button>
    </div>
  </div>
</div>

<div class="container">
  <!-- PANEL IZQUIERDO -->
  <div class="form-panel">
    <h2>📋 Datos</h2>
    <div class="form-group">
      <label>Paciente</label>
      <input type="text" id="nomPaciente" value="Ahtziry Lorenzo García">
    </div>
    <div class="form-group">
      <label>Fecha</label>
      <input type="text" id="fechaConsulta" value="21 de agosto de 2026">
    </div>
    <div class="form-group">
      <label>Hora</label>
      <input type="text" id="horaConsulta" value="14:16 hrs">
    </div>

    <div class="sec-divider"></div>

    <h2>📸 Imágenes</h2>
    <div class="photo-upload" onclick="document.getElementById('photoInput').click()">
      <div>📤 Agregar radiografías/fotos</div>
      <input type="file" id="photoInput" accept="image/*" multiple>
    </div>
    <div class="photo-grid" id="photoGrid"></div>

    <button class="btn-gen btn-ia" onclick="analizarConIAProxy()" style="margin-top:12px;">🔍 Análisis Radiográfico (via Proxy Seguro)</button>
    <div class="status" id="statusIA"></div>

    <div id="hallazgosIABox" style="display:none;">
      <div class="hallazgos-box">
        <strong>Análisis Radiográfico Exhaustivo:</strong>
        <div id="hallazgosIAText"></div>
      </div>
    </div>

    <div class="sec-divider"></div>

    <h2>👨‍⚕️ Tu Valoración Clínica</h2>
    <div class="form-group">
      <label>Observaciones clínicas detalladas</label>
      <textarea id="observacionesClinicas" placeholder="Ej: Equimosis malar izq, escalón palpable, limitación apertura 25mm, desviación..."></textarea>
    </div>

    <button class="btn-gen btn-integrar" onclick="integrarAnalisis()" style="margin-top:8px;">🔗 Integrar Análisis Completo</button>
    <div class="status" id="statusIntegracion"></div>

    <div class="btn-group" style="margin-top:20px;">
      <button class="btn-gen" onclick="generarDocumento()">📄 Generar Documento Final</button>
    </div>
  </div>

  <!-- PANEL DERECHO -->
  <div class="preview-panel">
    <button class="print-btn" onclick="window.print()">🖨️ Imprimir</button>
    <div class="sheet" id="preview"></div>
  </div>
</div>

<script>
let fotosAgregadas = [];
let hallazgosIAActuales = '';
let analisisIntegrado = '';

// Función para mostrar/ocultar API key
function toggleApiKey(){
  const input=document.getElementById('apiKey');
  const btn=event.target;
  if(input.type==='password'){
    input.type='text';
    btn.textContent='🙈';
  }else{
    input.type='password';
    btn.textContent='👁';
  }
}

// Función para cargar configuración desde DentaNota
function cargarConfiguracionDentaNota(){
  try{
    const encrypted=localStorage.getItem('dn_gemini_key');
    if(encrypted){
      const decrypted=desencriptarAES256Simple(encrypted);
      document.getElementById('apiKey').value=decrypted;
      alert('✓ API key cargada desde DentaNota');
      return;
    }
  }catch(e){
    console.error('Error cargando config:',e);
  }
  alert('No hay API key guardada en DentaNota. Ingresa una manualmente.');
}

function desencriptarAES256Simple(encoded){
  try{
    return atob(encoded).split('').reverse().join('');
  }catch(e){
    return '';
  }
}

async function analizarConIAProxy(){
  const apiKey=document.getElementById('apiKey').value;
  const proxyUrl=document.getElementById('proxyUrl').value;
  
  if(!apiKey){
    alert('Ingresa tu API Key de Gemini primero');
    return;
  }
  
  if(!proxyUrl){
    alert('Ingresa la URL de tu Cloud Function');
    return;
  }
  
  if(fotosAgregadas.length === 0){
    alert('Carga al menos una radiografía');
    return;
  }

  const status=document.getElementById('statusIA');
  status.classList.add('loading');
  status.textContent='🤖 Enviando al proxy seguro... Analizando radiografía...';

  try{
    const resultados=[];
    
    for(let i=0;i<fotosAgregadas.length;i++){
      const foto=fotosAgregadas[i];
      const tipoRadio=document.getElementById('tipoRadiografia')?.value || 'periapical';
      
      const response=await fetch('https://'+proxyUrl,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          imageBase64:foto.base64,
          imageType:tipoRadio,
          userApiKey:apiKey
        })
      });

      if(!response.ok){
        const err=await response.json();
        throw new Error(err.error || 'Error en proxy');
      }

      const result=await response.json();
      resultados.push(result.analysis);
      
      status.textContent=`🤖 Procesando radiografía ${i+1} de ${fotosAgregadas.length}...`;
    }

    hallazgosIAActuales=resultados.join('\n\n---\n\n');
    
    document.getElementById('hallazgosIAText').innerHTML=hallazgosIAActuales.replace(/\n/g,'<br>');
    document.getElementById('hallazgosIABox').style.display='block';

    status.classList.remove('loading');
    status.classList.add('success');
    status.textContent='✓ Análisis completado (via proxy seguro). Revisa los hallazgos.';
    setTimeout(()=>{status.textContent='';status.classList.remove('success');},4000);
    
  }catch(err){
    status.classList.remove('loading');
    status.classList.add('error');
    status.textContent='❌ '+err.message;
    console.error('Error proxy:',err);
  }
}

document.getElementById('photoInput').addEventListener('change', (e) => {
  for(let file of e.target.files){
    const reader = new FileReader();
    reader.onload = (evt) => {
      fotosAgregadas.push({ base64: evt.target.result, nombre: file.name });
      renderizarFotos();
    };
    reader.readAsDataURL(file);
  }
});

function renderizarFotos(){
  const html = fotosAgregadas.map((foto, idx) => `
    <div class="photo-card">
      <img src="${foto.base64}" alt="Foto ${idx+1}">
      <div class="photo-card-footer">
        <span class="photo-card-label">${foto.nombre.substring(0, 15)}</span>
        <button class="photo-remove" onclick="fotosAgregadas.splice(${idx}, 1); renderizarFotos()">✕</button>
      </div>
    </div>
  `).join('');
  document.getElementById('photoGrid').innerHTML = html;
}

async function analizarConIA(){
  const apiKey = document.getElementById('apiKey').value;
  if(!apiKey){
    alert('Ingresa tu API Key de Gemini primero');
    return;
  }
  if(fotosAgregadas.length === 0){
    alert('Carga al menos una radiografía');
    return;
  }

  const status = document.getElementById('statusIA');
  status.classList.add('loading');
  status.textContent = '🤖 Análisis exhaustivo en progreso...';

  try {
    const requestBody = {
      contents: [{
        parts: [
          {
            text: `RADIÓLOGO MAXILOFACIAL ESPECIALIZADO EN DETECCIÓN DE PATOLOGÍA Y TRAUMA.

**MISIÓN CRÍTICA: ADAPTAR EL ANÁLISIS AL TIPO DE IMAGEN. NO ANALIZAR ESTRUCTURAS QUE NO APARECEN.**

**PASO 1 - IDENTIFICAR TIPO DE IMAGEN (OBLIGATORIO - HACERLO PRIMERO):**

Antes de cualquier análisis, responde ESTO en un párrafo introductorio:
- Tipo de radiografía/imagen: [TIPO EXACTO]
- Estructuras VISIBLES en esta imagen: [LISTA]
- Estructuras AUSENTES (no analizar): [LISTA]
- Región/sector específico: [ZONA]

**TIPOS POSIBLES Y QUÉ ANALIZAR:**

**A) RADIOGRAFÍA PANORÁMICA (OPG):**
- Estructuras a analizar: Arco cigomático bilateral, cóndilos bilaterales, rama mandibular bilateral, dentición completa, seno maxilar, piso de órbita, borde basilar.
- NO analizar: Detalles apicales individuales, profundidad endo-apical, CBCT cortes.

**B) RADIOGRAFÍA PERIAPICAL (PA):**
- Estructuras a analizar: Raíces dentales (cantidad, longitud, forma), ápices (integridad, lesiones periapikal), alveolo (cresta, lámina dura), obturaciones endodónticas, quistes/granulomas, fracturas radiculares, densidad trabecular alveolar, hueso de soporte.
- NO analizar: Arco cigomático, cóndilos, órbita, seno maxilar (no visibles en PA).
- Análisis por SECTORES: ¿Anterior? ¿Posterior? ¿Molares? ¿Premolares?

**C) RADIOGRAFÍA OCLUSAL:**
- Estructuras a analizar: Dientes anteriores/posteriores según eje, alveolo, procesos alveolares, paladar duro, piso de boca, anomalías óseas locales.
- NO analizar: Arco cigomático, cóndilos, rama mandibular, órbita.

**D) TOMOGRAFÍA COMPUTARIZADA (CBCT) / TAC:**
- Estructuras a analizar: Cortes axial/sagital/coronal, profundidad 3D, volumen óseo, lesiones expansivas, fracturas con desplazamiento, relaciones anatómicas profundas, senos, conducto alveolar inferior, implantes, cálculos salivales.
- NO analizar: Superficies gengivales gingivales (invisible en CBCT).
- Especificar: ¿Qué corte/región está en la imagen? (anterior/posterior, superior/inferior, unilateral/bilateral)

**E) FOTOGRAFÍA CLÍNICA / IMAGEN CONVENCIONAL:**
- Estructuras a analizar: Solo lo que se ve visualmente (edema, asimetría facial, coloración, secreción, postura).
- NO analizar: Estructuras óseas internas, raíces, ápices.

---

**PASO 2 - ANÁLISIS ESPECÍFICO PARA EL TIPO IDENTIFICADO:**

**Si es PERIAPICAL:**
Análisis EXHAUSTIVO para ese sector específico solamente:

- **Raíces:** Presencia, número, longitud, curvatura, fracturas radiculares (líneas de radiolucidez).
- **Ápices:** ¿Cerrados, abiertos, reabsorbidos, hipercementados?
- **Lesiones periapikal:** ¿Granulomas, quistes, absesos? ¿Tamaño, radiolucencia, límites?
- **Alveolo:** Cresta ósea altura, lámina dura integridad, trabeculación, reabsorción alveolar.
- **Obturación endodóntica:** ¿Completa, sobreobturada, subobturada, fragmentada?
- **Fractura radicular:** ¿Línea vertical de radiolucidez que cruza la raíz? ¿Dónde exactamente?
- **Ligamento periodontal:** Ancho normal o engrosado (trauma oclusal).
- **Cálculos:** ¿Presentes?
- **Anomalías:** Supernumerarios, hipodontia, agenesia, retenidos.

**Si es PANORÁMICA:**
Análisis exhaustivo bilateral:
- Arco cigomático: Continuidad cortical, discontinuidades, escalones, edema, densidad.
- Cóndilos: Altura, forma, esclerosis, erosión, simetría condilar.
- Rama: Ancho, cortical, ángulo goníaco.
- Dentición: Presencia, estado (vital/endo/cariado), restauraciones, focos, alveolo.
- Seno/órbita: Si visibles.

**Si es OCLUSAL:**
- Dientes: Presentes, estado.
- Alveolo: Altura, lámina dura, trabeculación.
- Procesos: Anomalías óseas, expansiones.

**Si es CBCT:**
- Especificar CUÁL corte está en la imagen (axial superior, sagital anterior-posterior, coronal izquierda).
- Analizar la profundidad, volumen óseo, relaciones 3D.
- Lesiones expansivas, fracturas, dislocaciones.

---

**PASO 3 - BÚSQUEDA DE PATOLOGÍA (EXHAUSTIVA PERO ADAPTADA AL TIPO):**

Buscar ACTIVAMENTE:
- Líneas de fractura (donde aplique en ese tipo de imagen)
- Cambios de densidad / edema radiográfico
- Asimetrías (si hay bilateral)
- Lesiones radiolúcidas/radioopacas anormales
- Cambios degenerativos
- Discontinuidades corticales

---

**PASO 4 - RESPUESTA FINAL (PÁRRAFOS ADAPTADOS AL TIPO):**

**PARA PERIAPICAL:** 8-10 párrafos
- Párr 1: Tipo de imagen + estructuras presentes
- Párr 2-4: Raíces y ápices detallados
- Párr 5-6: Alveolo, cresta, ligamento
- Párr 7-8: Lesiones periapikal + obturación endo
- Párr 9-10: Hallazgos anormales + recomendaciones

**PARA PANORÁMICA:** 16-18 párrafos (la estándar)
- Todos los sectores bilaterales

**PARA OCLUSAL:** 6-8 párrafos
- Solo sector visible

**PARA CBCT:** 12-14 párrafos
- Corte específico + profundidad 3D

---

**REGLA DE ORO:**
**NO MENCIONES NUNCA ESTRUCTURAS QUE NO APARECEN EN LA IMAGEN.**

Si la imagen es periapical, **NO analices arco cigomático.**
Si es panorámica, **NO analices detalles apicales sutiles** (no se ven bien).
Si es oclusal, **NO hables de cóndilos.**
Si es CBCT, **SÓLO el corte visible**, no todo el volumen.

**TONO:** Clínico, exhaustivo, específico. Sin contaminar con análisis de otras imágenes.`
          },
          ...fotosAgregadas.map(foto => ({
            inlineData: {
              mimeType: "image/jpeg",
              data: foto.base64.split(',')[1]
            }
          }))
        ]
      }],
      generationConfig: {
        temperature: 0.7,
        maxOutputTokens: 7000
      }
    };

    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1/models/gemini-3.6-flash:generateContent?key=${apiKey}`,
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(requestBody)
      }
    );

    if(!response.ok){
      const errorData = await response.json();
      const errorMsg = errorData.error?.message || 'Error en la API';
      
      if(errorMsg.includes('quota') || errorMsg.includes('Quota')){
        status.classList.remove('loading');
        status.classList.add('error');
        status.textContent = '⏳ Quota excedido. Reintentando en 10 segundos...';
        
        setTimeout(() => {
          analizarConIA();
        }, 10000);
        return;
      }
      
      throw new Error(errorMsg);
    }

    const result = await response.json();
    hallazgosIAActuales = result.candidates[0]?.content?.parts[0]?.text || 'No se pudo analizar';
    
    document.getElementById('hallazgosIAText').innerHTML = hallazgosIAActuales.replace(/\n/g, '<br>');
    document.getElementById('hallazgosIABox').style.display = 'block';

    status.classList.remove('loading');
    status.classList.add('success');
    status.textContent = '✓ Análisis exhaustivo completado. Revisa y agrega valoración clínica.';
    setTimeout(() => {status.textContent = ''; status.classList.remove('success');}, 4000);
  } catch(err){
    status.classList.remove('loading');
    status.classList.add('error');
    status.textContent = '❌ ' + err.message;
  }
}

async function integrarAnalisis(){
  const apiKey = document.getElementById('apiKey').value;
  const observacionesClinicas = document.getElementById('observacionesClinicas').value;

  if(!hallazgosIAActuales){
    alert('Primero analiza las radiografías');
    return;
  }
  if(!observacionesClinicas.trim()){
    alert('Agrega tus observaciones clínicas');
    return;
  }

  const status = document.getElementById('statusIntegracion');
  status.classList.add('loading');
  status.textContent = '🔗 Integrando análisis completo...';

  try {
    const requestBody = {
      contents: [{
        parts: [
          {
            text: `Eres diagnóstico clínico experto maxilofacial. INTEGRA DE FORMA METICULOSA Y EXHAUSTIVA:

HALLAZGOS RADIOGRÁFICOS (IA - análisis exhaustivo):
${hallazgosIAActuales}

HALLAZGOS CLÍNICOS (Profesional - observación clínica):
${observacionesClinicas}

CREA: Un análisis diagnóstico integrado COMPLETO, METICULOSO, DETALLADO Y EXHAUSTIVO. Combine ambas perspectivas. Sea específico sin generalidades. Mencione TODOS los hallazgos relevantes. 

**ESTRUCTURA:**
1. Síntesis de hallazgos radiográficos principales
2. Síntesis de hallazgos clínicos principales
3. Correlación clínico-radiográfica
4. Interpretación diagnóstica integrada
5. Consideraciones diferenciales si aplica
6. Resumen de hallazgos significativos

Responde SOLO con el análisis completo, sin introducciones, 10-12 párrafos mínimo.`
          }
        ]
      }],
      generationConfig: {
        temperature: 0.7,
        maxOutputTokens: 6000
      }
    };

    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1/models/gemini-3.6-flash:generateContent?key=${apiKey}`,
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(requestBody)
      }
    );

    if(!response.ok){
      const errorData = await response.json();
      const errorMsg = errorData.error?.message || 'Error';
      
      if(errorMsg.includes('quota') || errorMsg.includes('Quota')){
        status.classList.remove('loading');
        status.classList.add('error');
        status.textContent = '⏳ Quota excedido. Reintentando en 10 segundos...';
        
        setTimeout(() => {
          integrarAnalisis();
        }, 10000);
        return;
      }
      
      throw new Error(errorMsg);
    }

    const result = await response.json();
    analisisIntegrado = result.candidates[0]?.content?.parts[0]?.text || 'No se pudo integrar';

    status.classList.remove('loading');
    status.classList.add('success');
    status.textContent = '✓ Análisis integrado completo.';
    setTimeout(() => {status.textContent = ''; status.classList.remove('success');}, 3000);

    generarDocumento();
  } catch(err){
    status.classList.remove('loading');
    status.classList.add('error');
    status.textContent = '❌ ' + err.message;
  }
}
